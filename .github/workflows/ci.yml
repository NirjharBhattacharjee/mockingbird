name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      # Integration tests (MOCKINGBIRD_INTEGRATION=1) need whisper-server, Ollama and
      # downloaded models; they run locally via `bun run test:integration` for now.
      - run: bun test
