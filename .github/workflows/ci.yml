name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      # Integration tests (MOCKINGBIRD_INTEGRATION=1) need whisper-server and
      # downloaded models; they run locally via `bun run test:integration` for now.
      - run: bun test

  # Linux and Windows (#151), not yet required: macOS-only parts (Core Text,
  # sandbox-exec, launchctl) skip there until they're ported.
  check-other:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test

  # whisper-server pulled by `models pull whisper-server` (#153), then the
  # whisper-server and transcribe integration tests with base.en, and the time
  # for one fixed file (MODELS.md §2).
  transcribe-other:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    defaults:
      run:
        shell: bash
    env:
      MOCKINGBIRD_HOME: ${{ github.workspace }}/.mb-home
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun apps/daemon/src/cli.ts models pull whisper-server
      - name: Models (base.en and the VAD, as the integration tests use)
        run: |
          mkdir -p "$MOCKINGBIRD_HOME/models" && cd "$MOCKINGBIRD_HOME/models"
          curl -fsSLo ggml-base.en.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-base.en.bin
          curl -fsSLo silero_vad.onnx https://github.com/snakers4/silero-vad/raw/v6.2.2/src/silero_vad/data/silero_vad.onnx
      - name: Put the pulled whisper-server on the PATH
        run: dirname "$(find "$MOCKINGBIRD_HOME/bin" -name 'whisper-server*' -type f | head -1)" >> "$GITHUB_PATH"
      # Says what it found; ffmpeg isn't on the runners and isn't needed here.
      - run: bun apps/daemon/src/cli.ts status || true
      - run: MOCKINGBIRD_INTEGRATION=1 bun test packages/asr/test/whisper-server.integration.test.ts apps/daemon/test/transcribe.test.ts
      - name: Time for bench/fixtures/hello.wav
        run: |
          for i in 1 2 3; do
            time MOCKINGBIRD_ASR_MODEL=ggml-base.en.bin bun apps/daemon/src/cli.ts transcribe bench/fixtures/hello.wav > /dev/null
          done

  cli-other:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/cli
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  # A motion page can't reach the network on any OS (#157): the pinned
  # Chrome, and the test that a page's fetch never reaches a local server.
  motion-network:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      MOCKINGBIRD_HOME: ${{ github.workspace }}/.mb-home
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun apps/daemon/src/cli.ts models pull chrome
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: MOCKINGBIRD_INTEGRATION=1 bun test packages/motion/test/html.integration.test.ts -t "network|slow to load|WebRTC|file URL|any tab"

  cli:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  # Every commit in a pull request carries a Signed-off-by line for its author
  # (`git commit -s`): the Developer Certificate of Origin, CONTRIBUTING.md §11.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$c")"
            if ! git log -1 --format=%B "$c" | grep -qixF "Signed-off-by: $author"; then
              echo "::error::$(git log -1 --format='%h %s' "$c") has no \"Signed-off-by: $author\" line."
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign off with \`git commit --amend -s\` (or \`git rebase --signoff $BASE\` for several commits), then push again."
          fi
          exit "$missing"
