name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      # Integration tests (MOCKINGBIRD_INTEGRATION=1) need whisper-server and
      # downloaded models; they run locally via `bun run test:integration` for now.
      - run: bun test

  # Bengali and CJK drawn with the shipped fonts (#156), on a Linux runner
  # that has no font for either and on macOS; the stills are kept as an
  # artifact. Linux gets Chrome straight from Chrome for Testing until it's
  # pinned there (#157).
  fonts:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      MOCKINGBIRD_HOME: ${{ github.workspace }}/.mb-home
      MOCKINGBIRD_STILLS: ${{ github.workspace }}/stills
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - if: runner.os == 'macOS'
        run: brew install ffmpeg && bun apps/daemon/src/cli.ts models pull chrome
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg
          curl -fsSLo chs.zip https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.80/linux64/chrome-headless-shell-linux64.zip
          echo "547dcd374e02961bf998f6046a267644f8502225c36bb78ca307dab32a0b3eb4  chs.zip" | sha256sum -c -
          unzip -q chs.zip -d "$RUNNER_TEMP"
          echo "MOCKINGBIRD_CHROME=$RUNNER_TEMP/chrome-headless-shell-linux64/chrome-headless-shell" >> "$GITHUB_ENV"
          bun -e 'import { FONT_FILES, pullFile } from "./apps/daemon/src/models.ts"; for (const f of FONT_FILES) await pullFile(f, process.env.MOCKINGBIRD_HOME + "/fonts");'
      - run: MOCKINGBIRD_INTEGRATION=1 bun test apps/daemon/test/fonts.integration.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: font-stills-${{ matrix.os }}
          path: stills

  cli:
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  # Every commit in a pull request carries a Signed-off-by line for its author
  # (`git commit -s`): the Developer Certificate of Origin, CONTRIBUTING.md §11.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$c")"
            if ! git log -1 --format=%B "$c" | grep -qixF "Signed-off-by: $author"; then
              echo "::error::$(git log -1 --format='%h %s' "$c") has no \"Signed-off-by: $author\" line."
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign off with \`git commit --amend -s\` (or \`git rebase --signoff $BASE\` for several commits), then push again."
          fi
          exit "$missing"
