name: release

# Push a tag like v0.1.0 that is on main. Users get it by re-running the
# install command, or with `brew upgrade` once the tap PR below is merged.
# A tag with a "-" (v0.2.0-rc.1) is a prerelease: published as one, installed
# only with MOCKINGBIRD_CHANNEL=beta, and left out of the Homebrew tap.
#
# Two deployments (#205): a tag deploys to `production`, and every push to
# the `staging` branch deploys to `staging`: the same checks and builds,
# published as a prerelease tagged staging-<sha> that MOCKINGBIRD_CHANNEL=
# staging installs. Each staging build gets its own tag, since moving one
# tag would make `git fetch --tags` fail in every clone that has it; older
# staging prereleases and their tags are deleted.
on:
  push:
    tags: ["v*.*.*"]
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    # Each environment only deploys from its own refs (repo settings): v* tags, and the staging branch.
    environment: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
    permissions:
      contents: write
    env:
      # The release's tag: the pushed one, or staging-<sha> for staging.
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('staging-{0}', github.sha) }}
    outputs:
      version: ${{ steps.pack.outputs.version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: The tag must be on main
        if: github.ref_type == 'tag'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME isn't on main. Releases are only cut from main."
            exit 1
          }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.mod
      # The `mockingbird` command, cross-compiled for every system the
      # installers support (#152).
      - name: Build the command
        working-directory: apps/cli
        run: |
          go test ./...
          for target in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64 windows-amd64; do
            os="${target%-*}" arch="${target#*-}" ext=""
            [ "$os" = windows ] && ext=.exe
            # The asset names say x64, as Node and Bun do.
            name="mockingbird-$os-${arch/amd64/x64}$ext"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.release=$TAG" -o "../../$name" .
          done
      # Our own tarball rather than GitHub's generated one, so the sha256 the
      # Homebrew formula pins is one we made and published.
      - name: Pack the source
        id: pack
        run: |
          version="${TAG#v}"
          archive="mockingbird-$version.tar.gz"
          git archive --format=tar.gz --prefix="mockingbird-$version/" -o "$archive" "$GITHUB_SHA"
          cp scripts/install.sh install.sh
          cp scripts/install.ps1 install.ps1
          shasum -a 256 "$archive" mockingbird-darwin-* mockingbird-linux-* mockingbird-windows-* install.sh install.ps1 > checksums.txt
          sha="$(shasum -a 256 "$archive" | cut -d' ' -f1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Through the environment, not spliced into the script: the version
          # comes from the tag name, which anyone who can push a tag picks.
          VERSION: ${{ steps.pack.outputs.version }}
        # install.sh is what the README's curl command fetches, from the
        # latest release rather than main, so merging a PR doesn't change what
        # new users run. A prerelease is never "latest".
        run: |
          assets=("mockingbird-$VERSION.tar.gz" mockingbird-darwin-* mockingbird-linux-* mockingbird-windows-* install.sh install.ps1 checksums.txt)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            prerelease=""
            case "$VERSION" in *-*) prerelease=--prerelease ;; esac
            gh release create "$TAG" --verify-tag --generate-notes $prerelease "${assets[@]}"
            exit 0
          fi
          # Never "latest", so the README's install command keeps the release.
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "staging ${GITHUB_SHA:0:7}" \
            --notes "The staging branch at $GITHUB_SHA, for trying before it reaches main. Install it with MOCKINGBIRD_CHANNEL=staging." \
            "${assets[@]}"
          # Only the newest staging build is kept.
          gh release list --limit 100 --json tagName --jq '.[].tagName' |
            grep '^staging-' | grep -vx "$TAG" |
            while read -r old; do gh release delete "$old" --cleanup-tag --yes; done

  homebrew:
    needs: release
    # Prereleases and staging are for testers who opt in, not for `brew upgrade`.
    if: ${{ github.ref_type == 'tag' && !contains(needs.release.outputs.version, '-') }}
    runs-on: ubuntu-latest
    steps:
      # The workflow's own token can't write to another repo, so this needs a
      # token with access to the tap. Without one the release still ships; the
      # formula is bumped by hand.
      - name: Open a PR bumping the formula
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::No TAP_TOKEN secret, so the Homebrew formula wasn't bumped to $VERSION."
            exit 0
          fi
          tap=NirjharBhattacharjee/homebrew-mockingbird
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/mockingbird-$VERSION.tar.gz"
          gh auth setup-git
          gh repo clone "$tap" tap -- --depth 1
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "mockingbird-$VERSION"
          sed -i -E "s|^  url \".*\"|  url \"$url\"|; s|^  sha256 \".*\"|  sha256 \"$SHA256\"|" Formula/mockingbird.rb
          git commit -am "mockingbird $VERSION"
          git push -u origin "mockingbird-$VERSION"
          # --repo makes gh ignore the local checkout, so it can't infer the branch.
          gh pr create --repo "$tap" --base main --head "mockingbird-$VERSION" \
            --title "mockingbird $VERSION" \
            --body "Release notes: https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
