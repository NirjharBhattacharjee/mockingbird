name: release

# Push a tag like v0.1.0 that is on main. Users get it by re-running the
# install command, or with `brew upgrade` once the tap PR below is merged.
# A tag with a "-" (v0.2.0-rc.1) is a prerelease: published as one, installed
# only with MOCKINGBIRD_CHANNEL=beta, and left out of the Homebrew tap.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    outputs:
      version: ${{ steps.pack.outputs.version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: The tag must be on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME isn't on main. Releases are only cut from main."
            exit 1
          }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      # The `mockingbird` command. Apple Silicon only, like the installer.
      - name: Build the command
        working-directory: apps/cli
        run: |
          go test ./...
          go build -trimpath -ldflags "-s -w -X main.release=$GITHUB_REF_NAME" -o ../../mockingbird-darwin-arm64 .
      # Our own tarball rather than GitHub's generated one, so the sha256 the
      # Homebrew formula pins is one we made and published.
      - name: Pack the source
        id: pack
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="mockingbird-$version.tar.gz"
          git archive --format=tar.gz --prefix="mockingbird-$version/" -o "$archive" "$GITHUB_REF_NAME"
          cp scripts/install.sh install.sh
          shasum -a 256 "$archive" mockingbird-darwin-arm64 install.sh > checksums.txt
          sha="$(shasum -a 256 "$archive" | cut -d' ' -f1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Through the environment, not spliced into the script: the version
          # comes from the tag name, which anyone who can push a tag picks.
          VERSION: ${{ steps.pack.outputs.version }}
        # install.sh is what the README's curl command fetches, from the
        # latest release rather than main, so merging a PR doesn't change what
        # new users run. A prerelease is never "latest".
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease \
            "mockingbird-$VERSION.tar.gz" mockingbird-darwin-arm64 install.sh checksums.txt

  homebrew:
    needs: release
    # Prereleases are for testers who opt in, not for `brew upgrade`.
    if: ${{ !contains(needs.release.outputs.version, '-') }}
    runs-on: ubuntu-latest
    steps:
      # The workflow's own token can't write to another repo, so this needs a
      # token with access to the tap. Without one the release still ships; the
      # formula is bumped by hand.
      - name: Open a PR bumping the formula
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::No TAP_TOKEN secret, so the Homebrew formula wasn't bumped to $VERSION."
            exit 0
          fi
          tap=NirjharBhattacharjee/homebrew-mockingbird
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/mockingbird-$VERSION.tar.gz"
          gh auth setup-git
          gh repo clone "$tap" tap -- --depth 1
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "mockingbird-$VERSION"
          sed -i -E "s|^  url \".*\"|  url \"$url\"|; s|^  sha256 \".*\"|  sha256 \"$SHA256\"|" Formula/mockingbird.rb
          git commit -am "mockingbird $VERSION"
          git push -u origin "mockingbird-$VERSION"
          # --repo makes gh ignore the local checkout, so it can't infer the branch.
          gh pr create --repo "$tap" --base main --head "mockingbird-$VERSION" \
            --title "mockingbird $VERSION" \
            --body "Release notes: https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
