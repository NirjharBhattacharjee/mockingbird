<!doctype html>
<html lang="en">
  <body style="margin: 0">
    <script type="module">
      // The default motion pass for long-form (16:9) or any edit that explains:
      // an opening title, chapter cards, a name, the camera gliding to what's
      // being talked about with a ring drawn round it, screenshots on floating
      // cards, pull quotes, and a running checklist. Copy it next to the video,
      // leave the import as it is (motion swaps in the kit), and write SCENES from the
      // transcript: every time is seconds into the video `motion` draws over.
      // Without a video (`size` and `duration`), the same scenes make a
      // stand-alone explainer to `inserts` into a render.
      import { easeIn, kit, page, picture, sfx, THEMES } from "KIT";

      // ---- settings --------------------------------------------------------
      const THEME = THEMES.night;
      /** The webcam's corner of the frame (0-1), redrawn as a bubble so zooms don't crop it; null for none. */
      const WEBCAM = {
        x: 0.705,
        y: 0.709,
        w: 0.29,
        h: 0.29,
      };
      const BROLL = "/absolute/path/to/screenshot.png";
      // What SCENES holds, by kind (every time in seconds; a Run is { text, italic?, accent? }, a line is a list of runs):
      // - intro { at, out, kicker, lines, count?: [from, to] }: a cold open over the whole frame; count counts a number up under the title.
      // - chapter { at, out, num, lines }
      // - name { at, out, name, role? }
      // - look { at, out, x, y, zoom, ring?: { rx, ry }, label? }: the camera glides to (x, y), 0-1 of the frame, at zoom; ring draws round a box there and label types beside it.
      // - photo { at, out, path, caption? }
      // - quote { at, out, text, by? }
      // - checklist { at, out, items: [{ label, done? }] }: chips across the top that stay on screen and tick at their done times.
      const SCENES = [
        {
          kind: "intro",
          at: 0,
          out: 3.3,
          kicker: "Devlog",
          lines: [
            [{ text: "How I'd " }, { text: "not", italic: true, accent: true }],
            [{ text: "learn to code" }],
          ],
          count: [2016, 2026],
        },
        { kind: "name", at: 3.8, out: 8.6, name: "How I'd learn to code", role: "Devlog · 2026" },
        {
          kind: "chapter",
          at: 18.97,
          out: 21.3,
          num: "01",
          lines: [[{ text: "Stop watching " }, { text: "tutorials", italic: true, accent: true }]],
        },
        {
          kind: "look",
          at: 21.6,
          out: 28.6,
          x: 0.23,
          y: 0.58,
          zoom: 1.8,
          ring: { rx: 0.1, ry: 0.19 },
          label: "mindless tutorials",
        },
        {
          kind: "checklist",
          at: 21.8,
          out: 63.6,
          items: [
            { label: "No tutorials", done: 22.4 },
            { label: "No how-to videos", done: 24.3 },
            { label: "No motivation videos", done: 41.9 },
            { label: "No copy-paste GPT", done: 50.0 },
          ],
        },
        {
          kind: "quote",
          at: 34.2,
          out: 38.8,
          text: "As long as you're not trying it out, you are never learning how to code.",
        },
        {
          kind: "chapter",
          at: 45.9,
          out: 48.3,
          num: "02",
          lines: [[{ text: "Stop copy-pasting" }], [{ text: "ChatGPT", italic: true, accent: true }]],
        },
        {
          kind: "look",
          at: 49.3,
          out: 57.6,
          x: 0.48,
          y: 0.6,
          zoom: 1.7,
          ring: { rx: 0.1, ry: 0.19 },
          label: "pure vibe coding",
        },
        {
          kind: "chapter",
          at: 64.04,
          out: 66.4,
          num: "03",
          lines: [[{ text: "Read the " }, { text: "docs", italic: true, accent: true }]],
        },
        { kind: "photo", at: 68.3, out: 74.8, path: BROLL, caption: "fastapi.tiangolo.com / learn" },
        { kind: "look", at: 75.6, out: 80, x: 0.24, y: 0.36, zoom: 1.7 },
      ];
      // ----------------------------------------------------------------------
      function draw(ctx, t, m) {
        const k = kit(ctx, t, m, THEME);
        const { W, H, u } = k;
        const T = k.theme;
        const runs = (lines) =>
          lines.map((l) =>
            l.map((r) => ({
              text: r.text,
              italic: r.italic,
              weight: r.italic ? 500 : 800,
              family: r.italic ? T.serif : T.display,
              color: r.accent ? T.accent : undefined,
            })),
          );
        const looks = SCENES.filter((s) => s.kind === "look");
        const cam = k.camera({ focus: { x: 0.5, y: 0.5 }, moves: looks, framings: [1], drift: 0.015 });
        if (WEBCAM) {
          // At rest the bubble sits exactly on the webcam; as the camera moves in it floats to an inset corner.
          const f = Math.min(1, Math.max(0, (cam.zoom - 1) / 0.3));
          const rest = { x: WEBCAM.x * W, y: WEBCAM.y * H, w: WEBCAM.w * W, h: WEBCAM.h * H };
          const w = W * 0.24;
          const h = (w * rest.h) / rest.w;
          const lerp = (a, b) => a + (b - a) * f;
          k.pip({
            src: WEBCAM,
            x: lerp(rest.x, W - w - 40 * u),
            y: lerp(rest.y, H - h - 40 * u),
            w: lerp(rest.w, w),
            h: lerp(rest.h, h),
            r: 28 * f,
          });
        }
        for (const s of SCENES) {
          if (t < s.at - 0.1 || t > s.out + 0.8) continue;
          if (s.kind === "look") {
            if (s.ring) {
              const c = cam.project(s.x, s.y);
              k.ring({
                x: c.x,
                y: c.y,
                rx: s.ring.rx * W * cam.zoom * 0.5,
                ry: s.ring.ry * H * cam.zoom * 0.5,
                at: s.at + 0.8,
                out: s.out - 0.6,
              });
              if (s.label) {
                const lx = c.x + s.ring.rx * W * cam.zoom * 0.55 + 30 * u;
                k.arrow({
                  x1: lx + 40 * u,
                  y1: c.y - 150 * u,
                  x2: lx - 10 * u,
                  y2: c.y - 40 * u,
                  at: s.at + 1.1,
                  out: s.out - 0.6,
                });
                k.title({
                  lines: [[{ text: s.label, italic: true, weight: 500, family: T.serif }]],
                  at: s.at + 1.2,
                  out: s.out - 0.6,
                  x: lx + 50 * u,
                  y: c.y - 190 * u,
                  align: "left",
                  size: 60,
                  style: "blur",
                  glow: true,
                });
              }
            }
          } else if (s.kind === "intro") {
            const leave = t > s.out ? easeIn((t - s.out) / 0.5) : 0;
            k.layer(() => {
              ctx.globalAlpha = 1 - leave;
              const z = 1 + leave * 1.8;
              ctx.translate(W / 2, H / 2);
              ctx.scale(z, z);
              ctx.translate(-W / 2, -H / 2);
              k.backdrop({ grid: true });
              k.bokeh({ count: 22, opacity: 0.4 });
              k.kicker({ text: s.kicker, at: s.at + 0.1, y: H * 0.3 });
              k.title({
                lines: runs(s.lines),
                at: s.at + 0.2,
                x: W / 2,
                y: H * 0.46,
                size: 120,
                style: "blur",
                gradient: true,
              });
              if (s.count)
                k.counter({
                  at: s.at + 0.6,
                  dur: 1.8,
                  from: s.count[0],
                  to: s.count[1],
                  y: H * 0.7,
                  size: 110,
                  group: false,
                });
              k.vignette(0.5);
            });
          } else if (s.kind === "chapter") {
            k.chapter({ num: s.num, title: runs(s.lines), at: s.at, out: s.out });
          } else if (s.kind === "name") {
            k.lowerThird({ name: s.name, role: s.role, at: s.at, out: s.out, y: H * 0.86 });
          } else if (s.kind === "photo") {
            const w = W * 0.44;
            const h = w * 0.62;
            const y = H * 0.2;
            k.scrim({ y: H / 2, h: H, strength: 0.5, at: s.at, out: s.out });
            if (s.caption)
              k.kicker({
                text: s.caption,
                at: s.at + 0.5,
                out: s.out,
                x: W * 0.5,
                y: y - 50 * u,
                align: "left",
                size: 26,
              });
            k.photo({ path: s.path, x: W * 0.5, y, w, h, at: s.at, out: s.out, tilt: 0.04 });
          } else if (s.kind === "quote") {
            k.quote({ text: s.text, by: s.by, at: s.at, out: s.out });
          } else if (s.kind === "checklist") {
            k.checklist({ items: s.items, at: s.at, out: s.out, y: H * 0.075, size: 30 });
          }
        }
        k.vignette(0.35);
        k.grain(0.05);
      }
      /** A shimmer on the opening, a whoosh into each chapter, a pop as each checklist item ticks, a click on each look. */
      function audio() {
        return SCENES.flatMap((s) => {
          if (s.kind === "intro")
            return [
              { path: sfx("shimmer"), at: s.at + 0.2, volume: 0.5 },
              { path: sfx("whoosh"), at: s.out - 0.1, volume: 0.6 },
            ];
          if (s.kind === "chapter")
            return [
              { path: sfx("whoosh"), at: Math.max(0, s.at - 0.15), volume: 0.6 },
              { path: sfx("whoosh"), at: s.out - 0.1, volume: 0.4 },
            ];
          if (s.kind === "checklist")
            return s.items
              .filter((i) => i.done !== undefined)
              .map((i) => ({ path: sfx("pop"), at: i.done, volume: 0.45 }));
          if (s.kind === "look") return [{ path: sfx("click"), at: s.at, volume: 0.4 }];
          if (s.kind === "photo" || s.kind === "quote")
            return [{ path: sfx("whoosh"), at: s.at, volume: 0.45 }];
          return [];
        });
      }

      // Pictures load with the page, before the first frame.
      for (const s of SCENES) if (s.kind === "photo") picture(s.path);
      page(draw, { audio });
    </script>
  </body>
</html>
