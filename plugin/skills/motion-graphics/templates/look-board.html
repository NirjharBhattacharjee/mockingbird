<!doctype html>
<html lang="en">
  <body style="margin: 0">
    <script type="module">
      // The look board (#262): the `look` tool fills in LOOK (the look the
      // agent wrote for this video, built) and BOARD (words from the video),
      // and renders this to show the user the look before editing starts.
      import { page } from "KIT";
      import look from "LOOK";

      const BOARD = "BOARD";
      if (typeof look?.make !== "function")
        throw new Error("The look's default export needs make(ctx, t, m), like a style in styles/.");
      const [first = "", second = "", third = ""] = BOARD.points;
      const stat = BOARD.stat;

      // The same beats as templates/styles.html, in the video's own words.
      function SCENE(l) {
        l.title(BOARD.title, { at: 0.1, dur: 0.9 });
        l.store(0.06, 0.32, 0.08, 0.2, { at: 1.3, dur: 0.8 });
        if (first) l.label(first, 0.1, 0.6, { at: 2.1 });
        l.link(0.16, 0.42, 0.23, 0.42, { at: 2.4, dur: 0.25 });
        const layers = [
          [0.27, 3],
          [0.34, 4],
          [0.41, 3],
        ];
        const y = (i, n) => 0.42 + (i - (n - 1) / 2) * 0.1;
        layers.slice(0, 2).forEach(([x, n], k) => {
          const [x2, n2] = layers[k + 1];
          for (let i = 0; i < n; i++)
            for (let j = 0; j < n2; j++)
              l.link(x, y(i, n), x2, y(j, n2), { at: 3.4 + (i * n2 + j) * 0.03, dur: 0.12, head: false, tone: "accent" });
        });
        let k = 0;
        for (const [x, n] of layers)
          for (let i = 0; i < n; i++) l.node(x, y(i, n), 22, { at: 2.7 + k++ * 0.06, tone: "accent" });
        if (second) l.label(second, 0.34, 0.68, { at: 4.0, tone: "accent" });
        l.link(0.45, 0.42, 0.52, 0.42, { at: 4.4, dur: 0.25 });
        l.box(0.54, 0.31, 0.15, 0.22, { at: 4.7, tone: "good" });
        l.mark("check", 0.615, 0.42, { at: 5.0, size: 40 });
        if (third) l.label(third, 0.615, 0.26, { at: 5.4, tone: "good" });
        l.link(0.64, 0.56, 0.42, 0.56, { at: 6.0, dur: 0.5, bend: -0.35, tone: "bad" });
        if (stat) {
          const to = stat.value;
          l.stat(stat.unit ?? "", 0.85, 0.45, {
            at: 6.8,
            count: [Math.round(to * 0.2), to],
            dur: 1.0,
            sub: stat.label,
            size: 90,
            tone: "accent",
          });
        }
      }

      page((ctx, t, m) => {
        const l = look.make(ctx, t, m);
        l.surface();
        SCENE(l);
        l.finish();
      });
    </script>
  </body>
</html>
