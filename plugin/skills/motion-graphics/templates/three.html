<!doctype html>
<html lang="en">
  <body style="margin: 0">
    <script type="module">
      // A 3D page with three.js (#270): motion fills in "THREE" and
      // "THREE_ADDONS" with the copies shipped beside the kit, and draws it on
      // the Mac's GPU. Everything is a function of `t` in mockingbird.draw,
      // never three's Clock, so every frame is the same each render. With
      // `path`, the video's frames arrive as m.video and go on the screen
      // plane as a texture.
      //
      // The look (#275): AgX tone mapping, a RoomEnvironment for soft
      // image-based light, one key light, bloom on what's brighter than white
      // before tone mapping, and depth of field if DOF is on. The camera is
      // the kit's (#274): named presets on the spring, noise for shakes.
      import { cameraAt } from "KIT";
      import * as THREE from "THREE";
      import {
        BokehPass,
        EffectComposer,
        OutputPass,
        RenderPass,
        RoomEnvironment,
        UnrealBloomPass,
      } from "THREE_ADDONS";

      // ---- settings --------------------------------------------------------
      /** The camera's moves: push-in, dolly, crash-zoom, whip-pan, orbit, handheld, dolly-zoom. */
      const MOVES = [
        { preset: "push-in", at: 0, dur: 3.5, strength: 1.4 },
        { preset: "orbit", at: 0.3, dur: 4, strength: 2.5 },
        { preset: "handheld", at: 0, strength: 0.6 },
      ];
      /** Hits: a shake that dies away. */
      const SHAKES = [];
      /** Bloom: how much, how wide, and how bright a pixel has to be to glow (1 is white). */
      const BLOOM = { strength: 0.6, radius: 0.5, threshold: 1 };
      /** Depth of field, focused on the screen; false keeps everything sharp. */
      const DOF = { aperture: 0.004, maxblur: 0.008 };

      const m = mockingbird;
      m.drawVideo = true;
      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(m.width, m.height);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.AgXToneMapping;
      document.body.append(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b0f1e);
      // Soft light from every side, as a studio's walls give it.
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.5;
      const camera = new THREE.PerspectiveCamera(40, m.width / m.height, 0.1, 100);
      // One key light, upper left, as in the 2D kit's `light`.
      const sun = new THREE.DirectionalLight(0xfff1e0, 3);
      sun.position.set(-4, 6, 5);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.radius = 4;
      scene.add(sun);

      // The footage as a texture. An ImageBitmap ignores flipY, so the UVs flip it.
      const footage = new THREE.Texture();
      footage.colorSpace = THREE.SRGBColorSpace;
      footage.flipY = false;
      footage.repeat.set(1, -1);
      footage.offset.set(0, 1);
      const screen = new THREE.Mesh(
        new THREE.BoxGeometry(3.2, 1.8, 0.08),
        // A display: the picture is its own light (just under white, so it
        // doesn't bloom), on dark glass that still catches the room's reflections.
        new THREE.MeshStandardMaterial({
          color: 0x0a0a0a,
          emissiveMap: footage,
          emissive: 0xffffff,
          emissiveIntensity: 0.85,
          roughness: 0.25,
        }),
      );
      screen.castShadow = true;
      scene.add(screen);
      // A lit edge round the screen, brighter than white, so it blooms.
      const edge = new THREE.Mesh(
        new THREE.TorusGeometry(2.05, 0.02, 16, 128),
        new THREE.MeshBasicMaterial({ color: new THREE.Color(0.6, 0.45, 2.4) }),
      );
      edge.scale.set(1, 0.6, 1);
      edge.position.z = -0.1;
      scene.add(edge);
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(30, 30),
        new THREE.MeshStandardMaterial({ color: 0x1a2140, roughness: 0.8 }),
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -1.3;
      floor.receiveShadow = true;
      scene.add(floor);

      // Bloom works on the HDR picture, then OutputPass tone-maps and converts to sRGB.
      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      composer.addPass(
        new UnrealBloomPass(new THREE.Vector2(m.width, m.height), BLOOM.strength, BLOOM.radius, BLOOM.threshold),
      );
      const bokeh = DOF && new BokehPass(scene, camera, { focus: 4.5, ...DOF });
      if (bokeh) composer.addPass(bokeh);
      composer.addPass(new OutputPass());

      /** The kit's camera at `t`, as a place in the scene: pans orbit, `z` dollies, zoom narrows the lens. */
      const BASE = { distance: 5.2, height: 0.6, fov: 40 };
      function place(t) {
        const c = cameraAt(t, { moves: MOVES, shakes: SHAKES });
        const angle = c.x * Math.PI * 0.9;
        const distance = BASE.distance * (1 - c.z);
        camera.position.set(
          Math.sin(angle) * distance + c.sx * 0.004,
          BASE.height - c.y * 2 + c.sy * 0.004,
          Math.cos(angle) * distance,
        );
        camera.fov = BASE.fov / c.zoom;
        camera.updateProjectionMatrix();
        camera.lookAt(0, 0, 0);
        camera.rotateZ(c.roll);
        if (bokeh) bokeh.uniforms.focus.value = distance;
      }

      m.draw = (t) => {
        if (m.video) {
          footage.image = m.video;
          footage.needsUpdate = true;
        }
        screen.rotation.y = 0.25 * Math.sin(t * 0.5);
        edge.rotation.y = screen.rotation.y;
        place(t);
        composer.render();
      };
    </script>
  </body>
</html>
